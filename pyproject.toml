[project]
name = "agriedge"
version = "0.1.0"
description = "Leakage-audited intrusion detection benchmarking for precision agriculture IIoT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agriedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
